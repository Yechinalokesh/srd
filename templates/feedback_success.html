<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback Received | Government of India</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f7fa; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .success-card { background: white; padding: 50px; border-radius: 16px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #128807; max-width: 400px; }
        i { font-size: 60px; color: #128807; margin-bottom: 20px; }
        h2 { color: #002752; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; line-height: 1.6; margin-bottom: 30px; }
        .btn { background: #002752; color: white; padding: 12px 25px; text-decoration: none; border-radius: 6px; font-weight: 700; font-size: 13px; }
    </style>
</head>
<body>
    <div class="success-card">
        <i class="fa-solid fa-circle-check"></i>
        <h2>Audit Submitted!</h2>
        <p>Your feedback regarding the commodity quality and service has been securely transmitted to the Ministry's database for evaluation.</p>
        <a href="/citizen_dashboard" class="btn">BACK TO DASHBOARD</a>
    </div>
</body>
</html>
